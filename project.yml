name: Reader
options:
  bundleIdPrefix: com.jimmyyao
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
  DEVELOPMENT_TEAM: JMYU8K3WZN
packages:
  FluidAudio:
    # Vendored v0.16.1 with local patches (see Vendor/FluidAudio/VENDORED.md); Reader uses only Kokoro
    path: Vendor/FluidAudio
  onnxruntime:
    # Debug-only CPU route benchmark (Listen debug → CPU route benchmark). Model is downloaded
    # at runtime into Application Support, never bundled.
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: 1.24.2
targets:
  Reader:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Features
      - path: Core
      - path: Resources/Assets.xcassets
      - path: Resources
        buildPhase: resources
        optional: true
        excludes:
          - Assets.xcassets
    dependencies:
      - package: FluidAudio
        product: FluidAudio
      - package: onnxruntime
        product: onnxruntime
    info:
      path: App/BGTasks-Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers:
          - com.jimmyyao.Reader.bake-audio
        UIBackgroundModes:
          - audio
          - processing
        NSMicrophoneUsageDescription: Reader uses the microphone when you tap the mic in the Browse address bar, so you can say what to search for.
        NSSpeechRecognitionUsageDescription: Reader turns what you say into text for the Browse address bar. Recognition runs on your iPhone when your language supports it.
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.jimmyyao.Reader
      DEVELOPMENT_TEAM: JMYU8K3WZN
      CODE_SIGN_STYLE: Automatic
      PRODUCT_NAME: Reader
      GENERATE_INFOPLIST_FILE: YES
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_CFBundleDisplayName: Meridian Reader
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_UIRequiresFullScreen: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # FluidAudio / Core ML needs enough stack / linker flexibility on Sim
      OTHER_LDFLAGS: $(inherited)
    scheme:
      testTargets:
        - ReaderTests
        - ReaderUITests

  ReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Reader
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.jimmyyao.ReaderTests
      TEST_HOST: $(BUILT_PRODUCTS_DIR)/Reader.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Reader
      BUNDLE_LOADER: $(TEST_HOST)

  ReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Reader
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.jimmyyao.ReaderUITests
