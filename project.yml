name: MeridianReader
options:
  bundleIdPrefix: com.jimmyyao
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
  DEVELOPMENT_TEAM: JMYU8K3WZN
packages:
  FluidAudio:
    # Vendored v0.16.1 with local patches (see Vendor/FluidAudio/VENDORED.md); Meridian Reader uses only Kokoro
    path: Vendor/FluidAudio
  onnxruntime:
    # Kokoro's ONNX CPU route (the main local route). The model is downloaded at runtime into
    # Application Support, never bundled.
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: 1.24.2
  ZIPFoundation:
    # Unzips EPUB files for book import.
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.20
targets:
  MeridianReader:
    type: application
    platform: iOS
    sources:
      # `.context/` folders are working notes for agents, not app resources.
      - path: App
        excludes: ["**/.context/**"]
      - path: Features
        excludes: ["**/.context/**"]
      - path: Core
        excludes: ["**/.context/**"]
      - path: Resources/Assets.xcassets
      - path: Resources
        buildPhase: resources
        optional: true
        excludes:
          - Assets.xcassets
          - Brand/**
    dependencies:
      - package: FluidAudio
        product: FluidAudio
      - package: onnxruntime
        product: onnxruntime
      - package: ZIPFoundation
        product: ZIPFoundation
    info:
      path: App/Info.plist
      properties:
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: Meridian Reader uses the microphone when you tap the mic in the Browse address bar, so you can say what to search for.
        NSSpeechRecognitionUsageDescription: Meridian Reader turns what you say into text for the Browse address bar. Recognition runs on your iPhone when your language supports it.
        # A Library row being dragged (`UTType.libraryItem`): the app's own type, so only the
        # Library's folders and lists take the drop.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.jimmyyao.reader.library-item
            UTTypeDescription: Meridian Reader Library item
            UTTypeConformsTo:
              - public.data
    settings:
      # The locked-fetch probe's install overrides these two on the xcodebuild command line
      # (`BUNDLE_ID_SUFFIX=.probe APP_DISPLAY_NAME="Meridian Reader Probe"`, see `App/LockedFetchProbe.swift`):
      # a second app, with its own data container and its own name on the home screen. They are
      # variables, not overrides of PRODUCT_BUNDLE_IDENTIFIER, so they reach only this target and
      # not the packages' resource bundles. A normal build leaves them as they are here.
      BUNDLE_ID_SUFFIX: ""
      APP_DISPLAY_NAME: Meridian Reader
      # Extra Swift conditions for this target only. A device measurement build sets
      # `READER_EXTRA_CONDITIONS=DEBUG` on a Release build: optimized, with the Debug-only launch
      # hooks (`-KokoroStress`, `-engineProbe`) compiled in, and the packages left as Release.
      READER_EXTRA_CONDITIONS: ""
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(READER_EXTRA_CONDITIONS)
      PRODUCT_BUNDLE_IDENTIFIER: com.jimmyyao.Reader$(BUNDLE_ID_SUFFIX)
      CODE_SIGN_STYLE: Automatic
      PRODUCT_NAME: MeridianReader
      GENERATE_INFOPLIST_FILE: YES
      # System controls tint with the asset; it mirrors `Palette.accent` (DesignSystemGalleryTests).
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_UIRequiresFullScreen: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - MeridianReaderTests
        - MeridianReaderUITests

  MeridianReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: MeridianReader
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.jimmyyao.ReaderTests
      TEST_HOST: $(BUILT_PRODUCTS_DIR)/MeridianReader.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MeridianReader
      BUNDLE_LOADER: $(TEST_HOST)

  MeridianReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: MeridianReader
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.jimmyyao.ReaderUITests
