name: MeridianReader
options:
  bundleIdPrefix: com.jimmyyao
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
  DEVELOPMENT_TEAM: JMYU8K3WZN
packages:
  FluidAudio:
    # Vendored v0.16.1 with local patches (see Vendor/FluidAudio/VENDORED.md); Meridian Reader uses only Kokoro
    path: Vendor/FluidAudio
  onnxruntime:
    # Kokoro's ONNX CPU route (the main local route). The model is downloaded at runtime into
    # Application Support, never bundled.
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: 1.24.2
  ZIPFoundation:
    # Unzips EPUB files for book import.
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.20
targets:
  MeridianReader:
    type: application
    platform: iOS
    sources:
      # `.context/` folders are working notes for agents, not app resources.
      - path: App
        excludes: ["**/.context/**"]
      - path: Features
        excludes: ["**/.context/**"]
      - path: Core
        excludes: ["**/.context/**"]
      - path: Resources/Assets.xcassets
      - path: Resources
        buildPhase: resources
        optional: true
        excludes:
          - Assets.xcassets
          - Brand/**
    dependencies:
      - package: FluidAudio
        product: FluidAudio
      - package: onnxruntime
        product: onnxruntime
      - package: ZIPFoundation
        product: ZIPFoundation
      - target: MeridianReaderShare
        embed: true
    entitlements:
      path: App/MeridianReader.entitlements
    info:
      path: App/Info.plist
      properties:
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: Meridian Reader uses the microphone when you tap the mic in the Browse address bar, so you can say what to search for.
        NSSpeechRecognitionUsageDescription: Meridian Reader turns what you say into text for the Browse address bar. Recognition runs on your iPhone when your language supports it.
        ITSAppUsesNonExemptEncryption: false
        # Probe installs set BUNDLE_ID_SUFFIX; SharedInbox reads this so the App Group matches.
        MeridianAppGroupSuffix: $(BUNDLE_ID_SUFFIX)
        # Open In / Copy to Meridian from Files and other apps (PDF, EPUB).
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.pdf
          - CFBundleTypeName: EPUB Publication
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.idpf.epub-container
        # Share Extension → host (`meridian-reader://inbox`) and future deep links.
        CFBundleURLTypes:
          - CFBundleURLName: com.jimmyyao.Reader
            CFBundleURLSchemes:
              - meridian-reader
        # A Library row being dragged (`UTType.libraryItem`): the app's own type, so only the
        # Library's folders and lists take the drop.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.jimmyyao.reader.library-item
            UTTypeDescription: Meridian Reader Library item
            UTTypeConformsTo:
              - public.data
    settings:
      # A probe install overrides these two on the xcodebuild command line
      # (`BUNDLE_ID_SUFFIX=.probe APP_DISPLAY_NAME="Meridian Reader Probe"`):
      # a second app, with its own data container and its own name on the home screen. They are
      # variables, not overrides of PRODUCT_BUNDLE_IDENTIFIER, so they reach only this target and
      # not the packages' resource bundles. A normal build leaves them as they are here.
      BUNDLE_ID_SUFFIX: ""
      APP_DISPLAY_NAME: Meridian Reader
      # Extra Swift conditions for this target only. A device measurement build sets
      # `READER_EXTRA_CONDITIONS=DEBUG` on a Release build: optimized, with the Debug-only launch
      # hooks (`-KokoroStress`, `-engineProbe`) compiled in, and the packages left as Release.
      READER_EXTRA_CONDITIONS: ""
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(READER_EXTRA_CONDITIONS)
      PRODUCT_BUNDLE_IDENTIFIER: com.jimmyyao.Reader$(BUNDLE_ID_SUFFIX)
      CODE_SIGN_STYLE: Automatic
      PRODUCT_NAME: MeridianReader
      GENERATE_INFOPLIST_FILE: YES
      # System controls tint with the asset; it mirrors `Palette.accent` (keep the two in step).
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      MARKETING_VERSION: "0.1.0"
      CURRENT_PROJECT_VERSION: "1"
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_UIRequiresFullScreen: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - MeridianReaderTests
        - MeridianReaderUITests


  # Share Extension: Safari / Files → App Group inbox → host opens Browse or Import.
  MeridianReaderShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Core/Incoming/SharedInbox.swift
    settings:
      BUNDLE_ID_SUFFIX: ""
      PRODUCT_BUNDLE_IDENTIFIER: com.jimmyyao.Reader$(BUNDLE_ID_SUFFIX).Share
      CODE_SIGN_STYLE: Automatic
      PRODUCT_NAME: MeridianReaderShare
      GENERATE_INFOPLIST_FILE: NO
      MARKETING_VERSION: "0.1.0"
      CURRENT_PROJECT_VERSION: "1"
      SKIP_INSTALL: YES
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    entitlements:
      path: ShareExtension/Share.entitlements
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Meridian Reader
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        MeridianAppGroupSuffix: $(BUNDLE_ID_SUFFIX)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Web URLs + PDF/EPUB (and file URLs for those books).
            NSExtensionActivationRule: 'SUBQUERY(extensionItems, $extensionItem, SUBQUERY($extensionItem.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url" OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.pdf" OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "org.idpf.epub-container" OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.file-url").@count > 0).@count > 0'

  MeridianReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: MeridianReader
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.jimmyyao.ReaderTests
      TEST_HOST: $(BUILT_PRODUCTS_DIR)/MeridianReader.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MeridianReader
      BUNDLE_LOADER: $(TEST_HOST)

  MeridianReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: MeridianReader
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.jimmyyao.ReaderUITests
