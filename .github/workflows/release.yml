# Meridian Reader — release workflow
#
# Runs from release-on-merge.yml (labeled PR merged to main) or by hand.
# Builds a Release archive, uploads to TestFlight or
# submits to the App Store, and cuts a GitHub Release with the release notes.
#
# Inputs:
#   target    — TestFlight | App Store submit | GitHub Release only
#   dry_run   — if true, stop before upload/tag/release and print what would happen
#
# Release notes come from release-notes/<version>.md (plain bullets).
# The workflow generates Resources/WhatsNew.json for the in-app sheet,
# and uses the same text for the GitHub Release body.
#
# Secrets (add in Settings → Secrets and variables → Actions):
#   ASC_KEY_ID        — App Store Connect API Key ID
#   ASC_ISSUER_ID     — App Store Connect API Issuer ID
#   ASC_KEY_P8        — contents of the .p8 private key file
#   BUILD_CERTIFICATE_BASE64 : base64 of the Apple Distribution .p12
#   P12_PASSWORD      : password of that .p12
#   KEYCHAIN_PASSWORD : any random string (locks the temporary keychain)
#   PROFILE_APP_BASE64   : base64 of "Meridian Reader AppStore" profile
#   PROFILE_SHARE_BASE64 : base64 of "Meridian Reader Share AppStore" profile
#
# The archive is built with automatic signing via the ASC API key. The export
# re-signs manually with the .p12 distribution certificate and the two App
# Store profiles, so no cloud signing (and no Admin key) is needed.
# The ASC key (App Manager) is used to read the latest build number and upload.

name: Release

run-name: "Release (${{ inputs.version || 'current version' }}, ${{ inputs.target || 'TestFlight' }}${{ inputs.dry_run && ', dry run' || '' }})"

on:
  # Called by release-on-merge.yml after it commits and tags a new version.
  workflow_call:
    inputs:
      version:
        description: "Version to build (X.Y.Z, already tagged)"
        required: true
        type: string
      ref:
        description: "Git ref to build (the release tag)"
        required: true
        type: string
      target:
        required: false
        type: string
        default: TestFlight
      dry_run:
        required: false
        type: boolean
        default: false
  # Manual runs rebuild the current version (latest v* tag) as a new build,
  # for re-uploading to TestFlight or submitting to the App Store.
  workflow_dispatch:
    inputs:
      target:
        description: "Release target"
        required: true
        type: choice
        options:
          - TestFlight
          - App Store submit
          - GitHub Release only
        default: TestFlight
      dry_run:
        description: "Dry run (stop before upload/tag)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# One release at a time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0

      # ── Compute version ─────────────────────────────────────────────
      # Called from release-on-merge: the version is passed in. Manual runs use
      # the latest v* tag, or project.yml MARKETING_VERSION if there is no tag.
      - name: Compute version
        env:
          INPUT_VERSION: ${{ inputs.version || '' }}
        run: |
          git fetch --tags --force --quiet
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION=$(git tag -l 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          fi
          if [ -z "$VERSION" ]; then
            VERSION=$(sed -n 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"\{0,1\}\([0-9.]*\).*/\1/p' project.yml | head -n1)
            echo "No v* tag yet, using project.yml MARKETING_VERSION"
          fi
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$VERSION' is not X.Y.Z"
            exit 1
          fi
          echo "Version $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # ── Release notes ───────────────────────────────────────────────
      # Required for App Store and GitHub releases. TestFlight builds can go
      # out without them (no What's New for that version).
      - name: Generate WhatsNew.json and plain-text notes
        run: |
          NOTES="release-notes/$VERSION.md"
          if [ ! -s "$NOTES" ]; then
            if [ "${{ inputs.target }}" = "TestFlight" ]; then
              echo "::warning::$NOTES is missing or empty, continuing without What's New"
              : > release_notes.txt
              exit 0
            fi
            echo "::error::$NOTES is missing or empty. Add release notes for $VERSION before releasing to ${{ inputs.target }}."
            exit 1
          fi
          python3 scripts/whats-new.py "$VERSION"

          # Plain-text notes for the GitHub Release
          python3 -c "
          import json, os, pathlib
          data = json.loads(pathlib.Path('Resources/WhatsNew.json').read_text())
          bullets = data['versions'].get(os.environ['VERSION'], [])
          notes = '\n'.join(f'• {b}' for b in bullets)
          pathlib.Path('release_notes.txt').write_text(notes)
          print(notes)
          "

      # ── Set version in project.yml and regenerate Xcode project ──────
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set version in project.yml
        run: |
          sed -i '' "s/MARKETING_VERSION: .*/MARKETING_VERSION: \"$VERSION\"/" project.yml
          echo "Set MARKETING_VERSION=$VERSION"

      # Phonon's model bundle ships in the app but isn't in git (~170 MB; docs/RELEASE.md).
      # XcodeGen needs Resources/PhononBundle to exist, so fetch it first.
      - name: Fetch the Phonon model bundle
        run: tools/fetch-phonon-bundle.sh

      - name: Generate Xcode project
        run: xcodegen generate

      # ── Select Xcode ────────────────────────────────────────────────
      - name: Select Xcode 26
        run: |
          # App Store uploads need the iOS 26 SDK. Picks the newest Xcode 26 on the runner.
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print 2>/dev/null | sort -V | tail -1)
          test -n "$XCODE" || { echo "::error::No Xcode 26 on this runner"; exit 1; }
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # ── Build archive (skipped for GitHub Release only) ──────────────
      - name: Write ASC API key
        if: ${{ inputs.target != 'GitHub Release only' }}
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8" > ~/private_keys/"AuthKey_${ASC_KEY_ID}.p8"

      # Build number = latest App Store Connect build + 1, so CI never clashes
      # with builds uploaded from Xcode. Falls back to project.yml + 1.
      - name: Pick build number
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          LOCAL=$(sed -n 's/^[[:space:]]*CURRENT_PROJECT_VERSION:[[:space:]]*"\{0,1\}\([0-9]*\).*/\1/p' project.yml | sort -n | tail -1)
          LATEST=""
          if [ "${{ inputs.target }}" != "GitHub Release only" ]; then
            LATEST=$(ruby -ropenssl -rjson -rbase64 -rnet/http -e '
              key = OpenSSL::PKey::EC.new(File.read(File.expand_path("~/private_keys/AuthKey_#{ENV["ASC_KEY_ID"]}.p8")))
              b64 = ->(x) { Base64.urlsafe_encode64(x, padding: false) }
              head = b64.(JSON.generate(alg: "ES256", kid: ENV["ASC_KEY_ID"], typ: "JWT"))
              body = b64.(JSON.generate(iss: ENV["ASC_ISSUER_ID"], iat: Time.now.to_i, exp: Time.now.to_i + 600, aud: "appstoreconnect-v1"))
              der = key.sign(OpenSSL::Digest::SHA256.new, "#{head}.#{body}")
              r, s = OpenSSL::ASN1.decode(der).value.map { |i| i.value.to_s(2).rjust(32, "\0")[-32, 32] }
              jwt = "#{head}.#{body}.#{b64.(r + s)}"
              uri = URI("https://api.appstoreconnect.apple.com/v1/builds?filter[app]=6829797590&sort=-uploadedDate&limit=20&fields[builds]=version")
              req = Net::HTTP::Get.new(uri); req["Authorization"] = "Bearer #{jwt}"
              res = Net::HTTP.start(uri.host, uri.port, use_ssl: true) { |h| h.request(req) }
              abort "ASC API #{res.code}" unless res.code == "200"
              puts JSON.parse(res.body)["data"].map { |b| b["attributes"]["version"].to_i }.max.to_i
            ') || echo "::warning::Could not read latest build from App Store Connect"
          fi
          if [ -n "$LATEST" ] && [ "$LATEST" -ge "${LOCAL:-0}" ]; then BASE=$LATEST; else BASE=${LOCAL:-0}; fi
          BUILD_NUMBER=$((BASE + 1))
          echo "Latest ASC build: ${LATEST:-unknown}, project.yml: ${LOCAL:-unknown}, using $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      # Based on GitHub's guide "Installing an Apple certificate on macOS runners".
      - name: Install distribution certificate and profiles
        if: ${{ inputs.target != 'GitHub Release only' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          PROFILE_APP_BASE64: ${{ secrets.PROFILE_APP_BASE64 }}
          PROFILE_SHARE_BASE64: ${{ secrets.PROFILE_SHARE_BASE64 }}
        run: |
          CERT="$RUNNER_TEMP/dist.p12"
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          test -n "$BUILD_CERTIFICATE_BASE64" || { echo "::error::BUILD_CERTIFICATE_BASE64 is empty"; exit 1; }
          echo "Decoding certificate"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT"
          echo "Certificate: $(wc -c < "$CERT") bytes"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "Importing certificate"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          PROFILES=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILES"
          for P in PROFILE_APP_BASE64 PROFILE_SHARE_BASE64; do
            FILE="$RUNNER_TEMP/$P.mobileprovision"
            test -n "${!P}" || { echo "::error::$P is empty"; exit 1; }
            printf '%s' "${!P}" | base64 --decode > "$FILE"
            UUID=$(security cms -D -i "$FILE" | plutil -extract UUID raw -)
            cp "$FILE" "$PROFILES/$UUID.mobileprovision"
            echo "Installed profile $UUID"
          done
          rm -f "$CERT"

      - name: Archive
        if: ${{ inputs.target != 'GitHub Release only' }}
        run: |
          xcodebuild archive \
            -project MeridianReader.xcodeproj \
            -scheme MeridianReader \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/MeridianReader.xcarchive" \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      # ── Export IPA ───────────────────────────────────────────────────
      - name: Write ExportOptions.plist
        if: ${{ inputs.target != 'GitHub Release only' }}
        run: |
          # project.yml is the single source of the team ID.
          TEAM_ID=$(sed -n 's/^[[:space:]]*DEVELOPMENT_TEAM:[[:space:]]*\([A-Z0-9]*\).*/\1/p' project.yml | head -n1)
          test -n "$TEAM_ID" || { echo "::error::DEVELOPMENT_TEAM not found in project.yml"; exit 1; }
          plutil -create xml1 "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert method -string app-store-connect "$RUNNER_TEMP/ExportOptions.plist"
          # A dry run exports the IPA locally and uploads nothing.
          plutil -insert destination -string ${{ inputs.dry_run && 'export' || 'upload' }} "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert teamID -string "$TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          # Manual signing with the .p12 distribution cert and App Store profiles.
          plutil -insert signingStyle -string manual "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert signingCertificate -string "Apple Distribution" "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert provisioningProfiles -dictionary "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert provisioningProfiles.com\\.jimmyyao\\.Reader -string "Meridian Reader AppStore" "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert provisioningProfiles.com\\.jimmyyao\\.Reader\\.Share -string "Meridian Reader Share AppStore" "$RUNNER_TEMP/ExportOptions.plist"
          plutil -p "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export
        if: ${{ inputs.target != 'GitHub Release only' }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MeridianReader.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}

      # ── Dry run gate ─────────────────────────────────────────────────
      - name: Dry run summary
        if: inputs.dry_run
        run: |
          echo "::notice::DRY RUN: would upload to ${{ inputs.target }}, tag v$VERSION, create GitHub Release"
          echo ""
          echo "Version: $VERSION"
          echo "Build:   $BUILD_NUMBER"
          echo "Target:  ${{ inputs.target }}"
          echo ""
          echo "Release notes:"
          cat release_notes.txt
          echo ""
          echo "Archive: $RUNNER_TEMP/MeridianReader.xcarchive"
          echo "IPA:     $(find "$RUNNER_TEMP/export" -name '*.ipa' 2>/dev/null || echo 'none')"

      # ── Upload note ────────────────────────────────────────────────
      # The Export step's ExportOptions.plist has method=app-store-connect and
      # destination=upload, so xcodebuild -exportArchive uploads the build to
      # App Store Connect inline. No separate upload step is needed (altool was
      # removed in Xcode 16).

      # ── Submit for App Review (App Store submit only) ─────────────────
      # After upload, the build processes on ASC's side (5–30 min). A submission
      # script would need to poll for processing, which is fragile. Instead:
      # for "App Store submit", the upload is done above; submit for review
      # manually in App Store Connect, or automate later with the ASC API.
      - name: App Store submit note
        if: ${{ !inputs.dry_run && inputs.target == 'App Store submit' }}
        run: |
          echo "::notice::Build uploaded. Submit for review in App Store Connect:"
          echo "  https://appstoreconnect.apple.com"
          echo ""
          echo "The build may take 5–30 minutes to process before it appears."

      # ── TestFlight / App Store What to Test ──────────────────────────
      # The ASC API can set What to Test (testFlightBetaAppLocalizations) and
      # What's New (appStoreVersionLocalizations) after upload, but the build
      # must finish processing first (5–30 min polling). For now, paste
      # release_notes.txt manually in App Store Connect after the build appears.

      # ── Tag and GitHub Release ─────────────────────────────────────
      # No version-bump commit to main: the build number comes from App Store
      # Connect at build time.
      # Runs only after a successful upload (earlier steps must pass).
      # Idempotent: an existing tag or Release is left alone.
      - name: Create tag and GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "Tag v$VERSION already exists"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "GitHub Release v$VERSION already exists"
          else
            gh release create "v$VERSION" --verify-tag \
              --title "v$VERSION" \
              --notes-file release_notes.txt
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Release ${VERSION:-unknown} (build ${BUILD_NUMBER:-unknown})"
            echo ""
            echo "- Target: ${{ inputs.target }}"
            echo "- Dry run: ${{ inputs.dry_run }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete temporary keychain
        if: always()
        run: |
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          if [ -f "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN"; fi
